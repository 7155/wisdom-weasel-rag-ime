name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python, schemas, and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q rag_ime scripts tests
      - name: Check package boundaries
        run: python scripts/check_import_boundaries.py
      - name: Validate product status
        run: python scripts/check_product_status.py --json
      - name: Audit public MiniMind completion contract
        run: python scripts/minimind_retraining.py audit
      - name: Inspect public release blockers
        run: python scripts/check_public_release.py --allow-blocked
      - name: Run unit suite
        run: python -m unittest discover -s tests
      - name: Check shell syntax
        run: |
          find scripts -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n

  macos:
    name: Native control and Squirrel release
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run native and patch contract tests
        run: |
          python -m unittest -v \
            tests.test_native_control_center \
            tests.test_build_patched_squirrel \
            tests.test_prepare_squirrel_workspace \
            tests.test_json_contracts \
            tests.test_database_migrations
      - name: Build native control center
        run: scripts/build_control_center.sh
      - name: Build headless voice agent
        run: scripts/build_voice_input.sh
      - name: Prepare pinned Squirrel source
        env:
          RAG_IME_SQUIRREL_WORKDIR: ${{ runner.temp }}/rag-ime-squirrel
        run: scripts/prepare_squirrel_workspace.sh
      - name: Build patched Squirrel Release
        env:
          RAG_IME_SQUIRREL_WORKDIR: ${{ runner.temp }}/rag-ime-squirrel
          RAG_IME_SQUIRREL_DERIVED_DATA: ${{ runner.temp }}/rag-ime-squirrel-derived-data
          RAG_IME_SQUIRREL_PREINSTALL: auto
          RAG_IME_SQUIRREL_SKIP_CODESIGN: "1"
        run: scripts/build_patched_squirrel.sh build
      - name: Verify native signatures
        run: |
          codesign --verify --deep --strict build/RagImeControl.app
          codesign --verify --deep --strict build/RagImeVoice.app

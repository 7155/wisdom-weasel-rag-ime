name: Apply Room authority patch

on:
  push:
    branches: [codex/room-workitem-acceptance-20260818]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: room-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Report verification start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 3 --body "Room authority verification started for \`${{ github.sha }}\`."
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Sync locked Python dependencies
        run: |
          python -m pip install "uv==0.11.1"
          uv sync --locked --python python
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate
      - name: Apply and verify authoritative Room workflow
        id: verify
        env:
          PYTHONWARNINGS: "error::ResourceWarning"
        run: |
          set -o pipefail
          {
            python scripts/codex_apply_room_workitem_authority.py
            python -m compileall -q rag_ime scripts tests
            python -m unittest discover -s tests -p 'test_agent_room_partner_workflow.py'
            python -m unittest discover -s tests -p 'test_agent_room_partner_application.py'
            python scripts/check_import_boundaries.py
            python scripts/check_route_ownership.py
            ruff check \
              rag_ime/agent_room_partner_workflow.py \
              rag_ime/agent_room_partner_application.py \
              rag_ime/agent_room_work.py \
              rag_ime/agent_service.py \
              tests/test_agent_room_partner_workflow.py \
              tests/test_agent_room_partner_application.py
            cd control-center-web
            pnpm install --frozen-lockfile
            pnpm typecheck
            pnpm test
            pnpm build
            cd ..
            git diff --check
          } 2>&1 | tee /tmp/room-authority-verification.log
      - name: Report verification failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Room authority verification failed on commit `${{ github.sha }}`.'
            echo
            echo '<details><summary>Last 180 log lines</summary>'
            echo
            echo '```text'
            tail -n 180 /tmp/room-authority-verification.log 2>/dev/null || true
            echo '```'
            echo '</details>'
          } > /tmp/room-authority-comment.md
          gh pr comment 3 --body-file /tmp/room-authority-comment.md
      - name: Commit only the verified source change
        if: success()
        run: |
          rm .github/workflows/apply-room-authority.yml
          rm scripts/codex_apply_room_workitem_authority.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(room): make Partner WorkItems authoritative"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Report verified commit
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 3 --body "Authoritative Room workflow verified and committed from \`${{ github.sha }}\`."

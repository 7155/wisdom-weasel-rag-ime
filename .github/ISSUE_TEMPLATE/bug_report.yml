name: Bug report
description: Report a reproducible product or source defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, personal input history, databases, or private
        Room/Session transcripts. Report security issues through SECURITY.md.
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The exact Git commit or installed source marker.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Control Center
        - Agent / Session / Tool
        - Room
        - Memory / knowledge / planning
        - Provider / Pi runtime
        - Rime / Squirrel / input assistance
        - Voice / browser / native bridge
        - Build / release / documentation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Minimal steps using synthetic or redacted data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
      description: Include real exit codes or redacted receipts where useful.
    validations:
      required: true

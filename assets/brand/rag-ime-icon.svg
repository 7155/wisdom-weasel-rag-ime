<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Product mark: a silver crescent holding one emerald working spark.
       This is the vector source of the same mark assets/brand/rag-ime-icon.png
       ships to the macOS .icns builds, so both files carry one identity: same
       ground (#022D3E), same full-bleed square, same composition. Flat by
       intent — the mark has to survive a 16px menu bar and a Dock tile, where
       gradient plates, glows and feathered tips turn to mud. -->

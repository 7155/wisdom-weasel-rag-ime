<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ee">
  <title>鹈鹕的海边骑行 · Pelican Club</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f5ee;
      --ink: #314c45;
      --muted: #7b8377;
      --line: #dfdfd2;
      --green: #346757;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible { outline: 3px solid #cb714e; outline-offset: 6px; }
    .page { width: min(1120px, calc(100% - 80px)); margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; height: 100px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark { width: 35px; height: 35px; }
    .brand-name { font-size: 13px; font-weight: 750; letter-spacing: 2px; }
    .edition { color: var(--muted); font-size: 11px; letter-spacing: 1.5px; }
    .intro { padding: 33px 0 27px; text-align: center; }
    .eyebrow { margin: 0 0 12px; font-family: Georgia, serif; font-size: 17px; font-style: italic; color: #7a8978; }
    h1 { margin: 0; font-family: "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif; font-size: clamp(29px, 3.5vw, 43px); font-weight: 600; letter-spacing: 4px; line-height: 1.4; }
    .scene-wrap { position: relative; overflow: hidden; border: 1px solid #dfdfcd; border-radius: 22px; background: #f4edce; }
    .scene { width: 100%; height: auto; display: block; }
    .scene-label { position: absolute; top: 25px; left: 28px; display: flex; gap: 7px; align-items: center; color: #7c896e; font-size: 10px; font-weight: 500; letter-spacing: 2px; pointer-events: none; }
    .scene-label::before { content: ""; width: 6px; height: 6px; background: #82a58b; border-radius: 50%; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 22px 3px; }
    .playback { display: flex; align-items: center; gap: 13px; min-width: 185px; }
    .play-button { display: grid; place-items: center; width: 43px; height: 43px; padding: 0; border: 1px solid var(--green); border-radius: 50%; background: var(--green); color: #fff9e7; cursor: pointer; transition: background-color 160ms ease, transform 120ms var(--ease-out); }
    .play-button svg { width: 16px; height: 16px; }
    .play-button:active { transform: scale(.94); }
    .state { margin: 0 0 3px; font-size: 12px; font-weight: 650; letter-spacing: .6px; }
    .hint { margin: 0; color: var(--muted); font-size: 10px; letter-spacing: .3px; }
    .speed { display: flex; align-items: center; gap: 13px; font-size: 11px; color: var(--muted); }
    .speed label { white-space: nowrap; }
    .speed input { width: 132px; height: 20px; margin: 0; accent-color: var(--green); cursor: pointer; }
    .speed output { min-width: 31px; font-variant-numeric: tabular-nums; color: var(--ink); }
    .save { display: flex; align-items: center; gap: 8px; padding: 10px 0 10px 15px; border: 0; background: transparent; color: var(--ink); font-size: 11px; letter-spacing: .5px; cursor: pointer; }
    .save svg { width: 15px; height: 15px; }
    footer { display: flex; justify-content: space-between; gap: 16px; padding: 18px 0 27px; border-top: 1px solid var(--line); color: #899080; font-size: 10px; letter-spacing: 1px; }
    footer span:last-child { font-family: Georgia, serif; font-style: italic; font-size: 12px; letter-spacing: .3px; }
    @media (hover: hover) and (pointer: fine) {
      .play-button:hover { background: #254f41; }
      .save:hover { color: #b45d43; }
    }
    @media (max-width: 640px) {
      .page { width: calc(100% - 32px); }
      header { height: 76px; }
      .brand-name { font-size: 10px; letter-spacing: 1.6px; }
      .brand-mark { width: 29px; height: 29px; }
      .edition { font-size: 9px; letter-spacing: .5px; }
      .intro { padding: 29px 0 24px; }
      .eyebrow { font-size: 15px; }
      h1 { letter-spacing: 2px; }
      .scene-wrap { border-radius: 15px; }
      .scene { width: 142%; max-width: none; margin-left: -21%; }
      .scene-label { top: 14px; left: 15px; font-size: 8px; letter-spacing: 1px; }
      .toolbar { display: grid; grid-template-columns: 1fr auto; gap: 18px 12px; padding: 20px 0; }
      .playback { min-width: 0; }
      .speed { grid-column: 1 / -1; grid-row: 2; justify-content: center; padding: 9px 16px; background: #eeeee4; border-radius: 25px; }
      .speed input { flex: 1; max-width: 230px; }
      footer { gap: 10px; font-size: 9px; letter-spacing: .2px; }
      footer span:last-child { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .play-button { transition: background-color 160ms ease; }
      .play-button:active { transform: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <circle cx="20" cy="20" r="17" stroke="currentColor" stroke-width="1.3"/>

          </g>
          <path d="M0 0h1200v720H0Z" fill="url(#paper-grain)" pointer-events="none"/>
          <g transform="translate(1059 65) rotate(12)" fill="none" stroke="#8e9b78" opacity=".75" aria-hidden="true">
            <circle r="35" stroke-width="1.2"/>
            <circle r="29" stroke-width=".8" stroke-dasharray="2 3"/>
            <path d="m-12 8 8-16 8 16m-16-6H2M6-8h10M11-8V8" stroke-width="1.3" stroke-linecap="round"/>
          </g>
        </svg>
      </div>

      <div class="toolbar" aria-label="骑行动画控制">
        <div class="playback">
          <button class="play-button" id="toggle-play" type="button" aria-label="暂停骑行" aria-pressed="false">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path id="play-icon" d="M5 4h3v12H5zM12 4h3v12h-3z"/></svg>
          </button>
          <div>
            <p class="state" id="ride-state" aria-live="polite">正在兜风</p>
            <p class="hint" id="ride-hint">海风会陪你慢慢走</p>
          </div>
        </div>
        <div class="speed">
          <label for="ride-speed">骑行速度</label>
          <input id="ride-speed" type="range" min="0.5" max="2" step="0.1" value="1" aria-valuetext="1.0 倍速度">
          <output id="speed-value" for="ride-speed">1.0×</output>
        </div>
        <button class="save" id="save-svg" type="button">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2v10m-4-4 4 4 4-4M3 13v4h14v-4"/></svg>
          保存 SVG
        </button>
      </div>
    </main>
    <footer><span>没有目的地，也是一段好旅程。</span><span>Made of sunshine &amp; a little SVG.</span></footer>
  </div>

  <script>
    (() => {
      'use strict';
      const byId = (id) => document.getElementById(id);
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const playButton = byId('toggle-play');
      const speedInput = byId('ride-speed');
      const parts = Object.fromEntries([
        'rear-spokes', 'front-spokes', 'crank', 'rider', 'feather-cuff',
        'scarf-tail', 'road-motion', 'water-lines', 'distant-birds',
        'near-upper', 'near-lower', 'near-foot', 'far-upper', 'far-lower', 'far-foot'
      ].map((id) => [id, byId(id)]));
      const TAU = Math.PI * 2;
      const degrees = 180 / Math.PI;
      const cycleSeconds = 2.2;
      let phase = .7;
      let speed = 1;
      let playing = !motionPreference.matches;
      let previousTime = null;
      let frameRequest = null;
      let roadDistance = 0;

      function transform(id, value) {
        parts[id].setAttribute('transform', value);
      }

      // Two rigid leg segments meet at a solved knee. Each foot stays on its pedal.
      function placeLeg(side, angle, bob) {
        const hip = { x: side === 'near' ? 548 : 536, y: 399 + bob };
        const pedal = { x: 580 + 33 * Math.cos(angle), y: 525 + 33 * Math.sin(angle) };
        const dx = pedal.x - hip.x;
        const dy = pedal.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const upper = 94;
        const lower = 89;
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const across = Math.sqrt(Math.max(0, upper * upper - along * along));
        const knee = {
          x: hip.x + along * dx / distance + across * dy / distance,
          y: hip.y + along * dy / distance - across * dx / distance
        };
        const upperAngle = Math.atan2(knee.y - hip.y, knee.x - hip.x) * degrees;
        const lowerAngle = Math.atan2(pedal.y - knee.y, pedal.x - knee.x) * degrees;
        transform(`${side}-upper`, `translate(${hip.x} ${hip.y}) rotate(${upperAngle})`);
        transform(`${side}-lower`, `translate(${knee.x} ${knee.y}) rotate(${lowerAngle})`);
        transform(`${side}-foot`, `translate(${pedal.x} ${pedal.y})`);
      }

      function draw() {
        const bob = motionPreference.matches ? 0 : Math.sin(phase * 2) * 1.65;
        // A 2:1 gear ratio ties the turning wheels and passing road to the crank.
        const wheelDegrees = phase * degrees * 2;
        transform('rear-spokes', `rotate(${wheelDegrees})`);
        transform('front-spokes', `rotate(${wheelDegrees})`);
        transform('crank', `rotate(${phase * degrees})`);
        transform('rider', `translate(0 ${bob})`);
        transform('feather-cuff', `translate(0 ${bob})`);
        transform('scarf-tail', `rotate(${Math.sin(phase * 2 - .5) * 2.1} 641 298)`);
        transform('road-motion', `translate(${-roadDistance} 0)`);
        transform('water-lines', `translate(${Math.sin(phase / 3) * 8} 0)`);
        transform('distant-birds', `translate(${Math.sin(phase / 4) * 4} ${Math.cos(phase / 3) * 2})`);
        placeLeg('far', phase + Math.PI, bob);
        placeLeg('near', phase, bob);
      }

      function tick(time) {
        frameRequest = null;
        if (!playing || document.hidden) { previousTime = null; return; }
        if (previousTime !== null) {
          const delta = Math.min((time - previousTime) / 1000, .05);
          const phaseDelta = delta * speed * TAU / cycleSeconds;
          phase += phaseDelta;
          roadDistance = (roadDistance + phaseDelta * 2 * 93) % 270;
        }
        previousTime = time;
        draw();
        frameRequest = requestAnimationFrame(tick);
      }

      function schedule() {
        if (playing && !document.hidden && frameRequest === null) {
          previousTime = null;
          frameRequest = requestAnimationFrame(tick);
        }
      }

      function refreshControls() {
        playButton.setAttribute('aria-label', playing ? '暂停骑行' : '开始骑行');
        playButton.setAttribute('aria-pressed', String(!playing));
        byId('play-icon').setAttribute('d', playing ? 'M5 4h3v12H5zM12 4h3v12h-3z' : 'M6 3.5 16 10 6 16.5Z');
        byId('ride-state').textContent = playing ? '正在兜风' : '歇一会儿';
        byId('ride-hint').textContent = !playing && motionPreference.matches
          ? '已遵循减少动态效果设置' : playing ? '海风会陪你慢慢走' : '好风景，值得停一停';
      }

      playButton.addEventListener('click', () => {
        playing = !playing;
        if (!playing && frameRequest !== null) {
          cancelAnimationFrame(frameRequest);
          frameRequest = null;
        }
        refreshControls();
        schedule();
      });

      speedInput.addEventListener('input', () => {
        speed = Number(speedInput.value);
        byId('speed-value').value = `${speed.toFixed(1)}×`;
        speedInput.setAttribute('aria-valuetext', `${speed.toFixed(1)} 倍速度`);
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden && frameRequest !== null) {
          cancelAnimationFrame(frameRequest);
          frameRequest = null;
        }
        previousTime = null;
        schedule();
      });

      motionPreference.addEventListener('change', () => {
        if (motionPreference.matches) {
          playing = false;
          if (frameRequest !== null) cancelAnimationFrame(frameRequest);
          frameRequest = null;
        }
        draw();
        refreshControls();
      });

      byId('save-svg').addEventListener('click', () => {
        const drawing = byId('pelican-scene').cloneNode(true);
        drawing.removeAttribute('class');
        drawing.setAttribute('width', '1200');
        drawing.setAttribute('height', '720');
        drawing.querySelector('desc').textContent = '鹈鹕沿海骑行的 SVG 插画，保存的是点击下载时的静态画面。';
        const markup = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(drawing);
        const url = URL.createObjectURL(new Blob([markup], { type: 'image/svg+xml;charset=utf-8' }));
        const link = document.createElement('a');
        link.href = url;
        link.download = 'pelican-seaside-ride.svg';
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });

      draw();
      refreshControls();
      schedule();
    })();
  </script>
</body>
</html>

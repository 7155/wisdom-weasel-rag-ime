interface:
  display_name: "Orchestrate Session"
  short_description: "Supervise concurrent subagents through verified closeout"
  default_prompt: "Use $orchestrate-session as the Session main Agent: batch-dispatch multiple independent background subagents when delegation helps, choose fresh/new or fork per child without a universal preference, continue the parent lane, integrate events reactively, verify both operability and requirement satisfaction, and reconcile every WorkItem to a truthful closeout."

interface:
  display_name: "Orchestrate Session"
  short_description: "Delegate private child work under parent ownership"
  default_prompt: "Use $orchestrate-session when private child Sessions provide concrete leverage. Keep the current Session responsible for the Goal and final result, give every child a bounded TaskBrief, choose fresh/new or fork from actual continuity needs, batch only independent work with real concurrency benefit, consume events without busy-polling, and integrate evidence against operability and requirement satisfaction."

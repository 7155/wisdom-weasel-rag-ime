    <path d="M24 25.6c4.9 0 9.4 2.1 12.2 5.4 2.4 2.8 3.8 6 3.8 8.8 0 4-3.4 6.4-8.2 6.4H16.2C11.4 46.2 8 43.8 8 39.8c0-2.8 1.4-6 3.8-8.8 2.8-3.3 7.3-5.4 12.2-5.4Z" />

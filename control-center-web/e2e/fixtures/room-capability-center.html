<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room Capability Center QA</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #root { min-width: 0; min-height: 100%; margin: 0; }
      body { background: var(--color-surface-subtle); padding: 14px; }
      #root { display: grid; width: min(1180px, 100%); min-width: 0; gap: 12px; margin: 0 auto; }
      .qa-band { min-width: 0; border: 1px solid var(--color-border); }
      .qa-inspectors { display: grid; min-width: 0; grid-template-columns: minmax(0, 1.4fr) minmax(300px, .6fr); gap: 12px; }
      .qa-inspectors > * { min-width: 0; border: 1px solid var(--color-border); }
      @media (max-width: 760px) { body { padding: 0; } #root { gap: 8px; } .qa-inspectors { grid-template-columns: 1fr; } .qa-band, .qa-inspectors > * { border-inline: 0; } }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script type="module" src="./room-capability-center.tsx"></script>
  </body>
</html>

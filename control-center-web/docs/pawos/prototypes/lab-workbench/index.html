<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Agent Lab · 工作台交互设计</title>
  <link rel="stylesheet" href="workbench.css">
</head>
<body>
<!-- Design prototype, 2026-09-06.
THESIS: Make a business goal, its candidate changes, and the evidence behind a decision one continuous workspace.
OWN-WORLD: PAW opaque white reading surfaces, cool gray structure, system type, restrained indigo actions.
STORY: Bring materials, establish criteria, inspect a failure, change a method, compare, try and deliver.
FIRST VIEWPORT: Stable project navigation; a large active artifact; a collapsible Guide; a persistent run strip.
FORM: User-directed workbench. The user explicitly delegated design decisions and superseded the skill's concept-selection gate.
SCOPE: All project content, execution, metrics and packaging here are synthetic interaction examples. No provider, file access or deployment.
-->
  <div class="prototype-banner"><span class="prototype-dot"></span><strong>交互设计原型</strong><span>示例材料与结果 · 未连接真实执行服务</span><button id="reset-demo" class="banner-button">重置演示</button></div>
  <header class="app-header">
    <div class="brand"><svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="6"/><ellipse cx="14" cy="14" rx="13" ry="4" transform="rotate(-30 14 14)"/><circle class="star" cx="23" cy="4" r="1.3"/></svg><span>Agent Lab</span></div>
    <span class="header-divider"></span>
    <button class="project-switch" id="project-switch"><span id="project-name">服务知识助手</span><span class="muted">⌄</span></button>
    <span class="header-stage" id="header-stage">实验改进</span>
    <div class="header-actions"><button class="quiet" id="new-project">＋ 新项目</button><button class="quiet" id="budget-button"><span class="status-dot"></span>本机演示</button><button class="icon-button" id="guide-toggle" aria-label="收起 Lab 引导" title="展开或收起 Lab 引导">◧</button></div>
  </header>
  <div class="shell">
    <aside class="sidebar" aria-label="项目导航">
      <div class="nav-label">项目</div>
      <nav id="project-nav">
        <button data-view="overview"><span class="nav-icon">⌂</span><span>工作概览</span></button>
        <button data-view="materials"><span class="nav-icon">▤</span><span>材料与环境</span><small>3</small></button>
        <button data-view="standards"><span class="nav-icon">☷</span><span>任务与标准</span><small>6</small></button>
        <div class="nav-label">优化</div>
        <button data-view="experiments"><span class="nav-icon">⑂</span><span>实验探索</span></button>
        <button data-view="methods"><span class="nav-icon">⌘</span><span>方法与代码</span></button>
        <button data-view="compare"><span class="nav-icon">⇄</span><span>版本比较</span></button>
        <div class="nav-label">应用</div>
        <button data-view="preview"><span class="nav-icon">▻</span><span>应用试用</span></button>
        <button data-view="delivery"><span class="nav-icon">↗</span><span>交付与导出</span></button>
      </nav>
      <div class="sidebar-bottom"><span class="small-label">当前目标</span><p>补齐业务条件<br>保留异常恢复能力</p><button class="text-button" data-view="overview">查看项目目标 <span>↗</span></button></div>
    </aside>
    <main id="workspace" tabindex="-1"></main>
    <aside class="guide" id="guide" aria-label="Lab 引导与对象详情">
      <div class="guide-tabs" role="tablist"><button role="tab" id="guide-chat-tab" aria-selected="true">Lab 引导</button><button role="tab" id="guide-detail-tab" aria-selected="false">对象详情</button><button id="guide-close" class="icon-button" aria-label="收起引导">×</button></div>
      <div id="guide-body"></div>
    </aside>
  </div>
  <section class="run-console" id="run-console" aria-label="运行记录" hidden>
    <div class="console-header"><strong>运行记录</strong><span id="console-run-id" class="mono muted"></span><button class="icon-button" id="console-close" aria-label="收起运行记录">×</button></div>
    <div id="console-events"></div>
  </section>
  <footer class="run-strip"><button id="console-toggle"><span class="status-dot" id="run-dot"></span><span id="run-status-text">示例项目已就绪</span><span class="muted" id="run-count">6 条开发任务</span><span class="muted">⌃</span></button><span class="strip-right"><span id="save-state">仅保存在此浏览器</span><button id="run-control" class="text-button" hidden>停止演示</button><span class="keyboard-hint">⌘ K</span></span></footer>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <script src="workbench.js"></script>
</body>
</html>
